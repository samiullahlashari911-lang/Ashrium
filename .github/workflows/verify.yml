name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build

  supabase-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start local Supabase
        run: npx --yes supabase@2.110.0 start

      - name: Apply and verify migrations
        run: npx --yes supabase@2.110.0 db reset --local

      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@2.110.0 stop --no-backup
